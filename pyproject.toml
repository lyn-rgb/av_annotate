[project]
name = "avannotate"
version = "0.1.0"
description = "Offline annotation pipeline: face tracks, per-person speech, transcripts and paralinguistic tags from multi-person video."
# Tested on 3.10.15, which is what the development venv has.  Declaring 3.11
# here would have claimed a floor nothing had ever been run against.
requires-python = ">=3.10"
dependencies = []

[project.scripts]
avannotate = "avannotate.cli:main"

# Dependencies are grouped by stage so a server installs only what it runs.
# The deterministic core (annotation rendering, association, segmentation, QA)
# needs none of them -- it is pure Python over JSON, which is what makes it
# testable without a GPU.
[project.optional-dependencies]
media = [
    "numpy>=1.24",
    "soundfile>=0.12",
]
faces = [
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "insightface>=0.7",
    "onnxruntime-gpu>=1.17",
]
diarization = [
    "torch>=2.1",
    "pyannote.audio>=3.1",
]
asd = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
]
tse = [
    "clearvoice",
]
asr = [
    "faster-whisper>=1.0",
]
# One package per tagger dimension, so a machine can run the ones it has.  The
# `dimensions` key in the stage config says which, and a dimension that is not
# listed is never imported.
paralinguistic = [
    "funasr",
    "modelscope",
    "transformers>=4.51",
    "torch>=2.1",
    "panns-inference",
]
caption = [
    "transformers>=4.51",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Must match `requires-python`; a higher target here makes ruff suggest
# stdlib APIs the declared floor does not have.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["avannotate"]

# Third-party packages with no type information.  Declared here rather than as
# inline `# type: ignore` comments because the code has to check in two
# environments: a machine without these installed reports `import-not-found`,
# one with them reports `import-untyped`, and an inline ignore can only name one
# of the two.
[[tool.mypy.overrides]]
# Everything the model adapters import lazily.  None of it is installed on a
# development machine, which is the point: the core is pure Python and the
# adapters are the only part that needs a GPU.
module = [
    "diarizen.*",
    "torch",
    "torch.*",
    "torchaudio",
    "insightface.*",
    "clearvoice.*",
    "faster_whisper.*",
    "funasr.*",
    "transformers.*",
    "panns_inference.*",
    "librosa.*",
    "PIL.*",
]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["avannotate*"]
